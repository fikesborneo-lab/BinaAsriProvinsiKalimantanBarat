<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#gradEmerald)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldRing)" stroke-width="2" opacity="0.9" />

  <!-- Emblem: Stylized Health Cross with Heart and Leaves -->
  <g filter="url(#shadow)">
    <!-- White Medical Cross Silhouette with Rounded Corners -->
    <path d="M28 16 H36 V26 H46 V34 H36 V44 H28 V34 H18 V26 H28 Z" fill="#ffffff" />
    <!-- Center Red/Coral Heart representing humanitarian care -->
    <path d="M32 29.5 C32 29.5 25 24 25 20.5 C25 18 27 16.5 29.2 16.5 C30.6 16.5 31.5 17.2 32 18 C32.5 17.2 33.4 16.5 34.8 16.5 C37 16.5 39 18 39 20.5 C39 24 32 29.5 32 29.5 Z" fill="#ef4444" transform="scale(0.7) translate(13.7, 10)" />
    <!-- Emerald Leaf Accent in Center Bottom -->
    <path d="M32 30 C30 35 24 37 24 41 C24 45 28 47 32 47 C36 47 40 45 40 41 C40 37 34 35 32 30 Z" fill="#059669" opacity="0.95" />
    <path d="M32 33 L32 45" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
